name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    # 手動実行でも main 以外のブランチからは公開しない（--ref の選び間違いで未レビューのコードを出さない）
    if: >-
      github.ref == 'refs/heads/main' && (
        github.event_name == 'workflow_dispatch' ||
        startsWith(github.event.head_commit.message, 'chore: refresh documentation snapshot')
      )
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build package
        run: npm run build

      - name: Verify npm package contents
        run: npm pack --dry-run

      - name: Read package metadata
        id: meta
        run: |
          echo "name=$(npm pkg get name --workspaces=false | tr -d '\"')" >> "$GITHUB_OUTPUT"
          echo "version=$(npm pkg get version --workspaces=false | tr -d '\"')" >> "$GITHUB_OUTPUT"
          echo "tag=v$(npm pkg get version --workspaces=false | tr -d '\"')" >> "$GITHUB_OUTPUT"

      - name: Check whether version is already published
        id: npm_state
        env:
          PACKAGE_NAME: ${{ steps.meta.outputs.name }}
          PACKAGE_VERSION: ${{ steps.meta.outputs.version }}
        run: |
          if npm view "${PACKAGE_NAME}@${PACKAGE_VERSION}" version >/dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
            # npm publish が記録した公開元コミット。後処理だけやり直してよいかの判定に使う
            echo "git_head=$(npm view "${PACKAGE_NAME}@${PACKAGE_VERSION}" gitHead)" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Validate release state
        id: release_state
        env:
          TAG_NAME: ${{ steps.meta.outputs.tag }}
          MERGE_COMMIT_SHA: ${{ github.sha }}
          PACKAGE_PUBLISHED: ${{ steps.npm_state.outputs.published }}
          PUBLISHED_GIT_HEAD: ${{ steps.npm_state.outputs.git_head }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag_exists=false
          release_exists=false
          tag_commit=""

          if git rev-parse "${TAG_NAME}^{commit}" >/dev/null 2>&1; then
            tag_exists=true
            tag_commit="$(git rev-parse "${TAG_NAME}^{commit}")"
          fi

          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            release_exists=true
          fi

          if [ "$tag_exists" = "true" ] && [ "$tag_commit" != "$MERGE_COMMIT_SHA" ]; then
            echo "Tag ${TAG_NAME} points to ${tag_commit}, not ${MERGE_COMMIT_SHA}"
            exit 1
          fi

          if [ "$PACKAGE_PUBLISHED" = "true" ]; then
            echo "should_publish=false" >> "$GITHUB_OUTPUT"

            if [ "$tag_exists" = "true" ] && [ "$release_exists" = "true" ]; then
              echo "should_finalize=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            # publish 後に tag / release の作成で止まった場合は、publish を飛ばして足りない方だけ作る。
            # 公開元が別コミットなら、このコミットに tag を打つと食い違うので止める
            if [ "$PUBLISHED_GIT_HEAD" != "$MERGE_COMMIT_SHA" ]; then
              echo "npm version was published from ${PUBLISHED_GIT_HEAD:-unknown}, not ${MERGE_COMMIT_SHA}"
              exit 1
            fi

            echo "Recovering missing tag or GitHub release for an already published version"
            echo "should_finalize=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "$tag_exists" = "true" ] || [ "$release_exists" = "true" ]; then
            echo "Tag or GitHub release already exists for an unpublished npm version"
            exit 1
          fi

          echo "should_publish=true" >> "$GITHUB_OUTPUT"
          echo "should_finalize=true" >> "$GITHUB_OUTPUT"

      - name: Upgrade npm for trusted publishing
        if: steps.release_state.outputs.should_publish == 'true'
        run: |
          npm install -g "npm@>=11.5.1"
          npm -v

      - name: Publish to npm
        if: steps.release_state.outputs.should_publish == 'true'
        run: npm publish --provenance --access public

      - name: Create git tag if missing
        if: steps.release_state.outputs.should_finalize == 'true'
        env:
          TAG_NAME: ${{ steps.meta.outputs.tag }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if git rev-parse "$TAG_NAME" >/dev/null 2>&1; then
            echo "Tag $TAG_NAME already exists"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git tag "$TAG_NAME"
          git push origin "$TAG_NAME"

      - name: Create GitHub release
        if: steps.release_state.outputs.should_finalize == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ steps.meta.outputs.tag }}
        run: |
          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            echo "Release $TAG_NAME already exists"
            exit 0
          fi

          gh release create "$TAG_NAME" \
            --title "$TAG_NAME" \
            --generate-notes
