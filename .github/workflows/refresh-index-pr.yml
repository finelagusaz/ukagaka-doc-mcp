name: Refresh Index PR

on:
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:

concurrency:
  group: refresh-index-pr
  cancel-in-progress: false

jobs:
  refresh-index-pr:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Refresh snapshot
        shell: bash
        run: npm run refresh:index 2>&1 | tee "$RUNNER_TEMP/refresh-index.log"

      # パーサーは上流の未知の章・ディレクトリを警告して読み飛ばすだけでビルドは通る。
      # auto-merge の前に人の目に入るよう、警告を PR 本文・ジョブサマリー・注釈に載せる
      - name: Collect parser warnings
        id: warnings
        shell: bash
        run: |
          grep -E '^\[[a-z-]+\] Warning:' "$RUNNER_TEMP/refresh-index.log" > "$RUNNER_TEMP/warnings.txt" || true
          if [ ! -s "$RUNNER_TEMP/warnings.txt" ]; then
            exit 0
          fi
          while IFS= read -r line; do
            echo "::warning title=Parser warning::$line"
          done < "$RUNNER_TEMP/warnings.txt"
          {
            echo '## ⚠️ Parser warnings'
            echo
            echo 'Pages below were skipped. Map the new section in the parser (see CLAUDE.md Gotchas).'
            echo
            echo '```'
            cat "$RUNNER_TEMP/warnings.txt"
            echo '```'
          } > "$RUNNER_TEMP/warnings.md"
          cat "$RUNNER_TEMP/warnings.md" >> "$GITHUB_STEP_SUMMARY"
          {
            echo "body<<EOF_WARNINGS"
            cat "$RUNNER_TEMP/warnings.md"
            echo "EOF_WARNINGS"
          } >> "$GITHUB_OUTPUT"

      - name: Detect snapshot changes
        id: snapshot
        run: |
          if git diff --quiet --exit-code -- data/index.json docs/ukadoc docs/ukadoc-ssp docs/yaya-docs docs/satori-docs docs/aosora-wiki docs/minato docs/pasta docs/kawari-docs; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Bump patch version for release
        if: steps.snapshot.outputs.changed == 'true'
        run: npm version patch --no-git-tag-version

      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Create or update refresh PR
        id: cpr
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ steps.app-token.outputs.token }}
          commit-message: 'chore: refresh documentation snapshot'
          title: 'chore: refresh documentation snapshot'
          body: |
            Automated documentation snapshot refresh.

            This PR updates:
            - `docs/ukadoc` / `docs/ukadoc-ssp` / `docs/yaya-docs` / `docs/satori-docs` / `docs/aosora-wiki` / `docs/minato` / `docs/pasta` / `docs/kawari-docs` submodule pointers
            - `data/index.json`
            - package patch version for the release that follows merge

            ${{ steps.warnings.outputs.body }}
          branch: bot/refresh-index
          delete-branch: true
          labels: auto-index-refresh
          add-paths: |
            data/index.json
            docs/ukadoc
            docs/ukadoc-ssp
            docs/yaya-docs
            docs/satori-docs
            docs/aosora-wiki
            docs/minato
            docs/pasta
            docs/kawari-docs
            package.json
            package-lock.json

      - name: Enable auto-merge
        if: steps.cpr.outputs.pull-request-number != ''
        uses: peter-evans/enable-pull-request-automerge@v3
        with:
          token: ${{ steps.app-token.outputs.token }}
          pull-request-number: ${{ steps.cpr.outputs.pull-request-number }}
          merge-method: squash
